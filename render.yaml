services:
  - type: web
    name: tyc-islamic-finance-advisor
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.app:app --log-level info --access-logfile - --error-logfile - --capture-output
    envVars:
      - key: OPENAI_API_KEY
        sync: false  # You'll need to set this in Render dashboard
      - key: PYTHONUNBUFFERED
        value: "1"

